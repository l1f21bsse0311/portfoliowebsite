name: Linting and Build Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    name: Linting Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Linting Tools
        run: npm install --save-dev htmlhint stylelint

      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"

      - name: Lint CSS Files
        run: npx stylelint "**/*.css"

  build:
    name: Build Job
    runs-on: ubuntu-latest
    needs: lint 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
